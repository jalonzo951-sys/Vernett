<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f9edf8">
<meta name="description" content="Todos los enlaces oficiales de Vernette Voxel Studio: Instagram, TikTok y WhatsApp.">
<meta property="og:title" content="Vernette Voxel Studio | Conecta con nosotros">
<meta property="og:description" content="Creatividad e impresión 3D. Encuentra nuestras redes y contáctanos desde un solo lugar.">
<title>Vernette Voxel Studio · Mis enlaces</title>
<style>
:root{color-scheme:light;--ink:#362343;--mute:#765f80;--plum:#6d3d83;--border:#e9d9ed}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:26px 16px;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:radial-gradient(circle at 10% 10%,#ffdcf0 0,transparent 45%),radial-gradient(circle at 90% 70%,#e4d7ff 0,transparent 44%),#fcf9ff}
main{position:relative;width:min(100%,450px);padding:34px 24px 28px;background:rgba(255,255,255,.96);border:1px solid #f2e3f2;border-radius:30px;text-align:center;box-shadow:0 18px 60px #63367120}
.mark{width:88px;height:88px;border-radius:26px;margin:0 auto 18px;display:grid;place-items:center;background:linear-gradient(135deg,#f9cde6,#d9c4ff);box-shadow:0 8px 24px #7a50952a;font-size:27px;font-weight:900;letter-spacing:-1px;color:#6a3b81}
.chip{display:inline-block;margin:0 0 15px;padding:7px 12px;border-radius:999px;background:#f9e5f2;color:#814c78;font-size:10px;text-transform:uppercase;letter-spacing:1.4px;font-weight:800}
h1{font-size:clamp(24px,7vw,30px);line-height:1.1;letter-spacing:-.9px;margin:0 0 10px}
.subtitle{color:var(--mute);font-size:15px;line-height:1.55;margin:0 0 26px}
nav{display:grid;gap:12px}a.btn{display:flex;align-items:center;text-align:left;gap:14px;text-decoration:none;color:var(--ink);border:1px solid var(--border);background:#fff;border-radius:18px;padding:15px 17px;min-height:75px;transition:transform .15s,box-shadow .15s}
a.btn:hover,a.btn:focus-visible{transform:translateY(-2px);box-shadow:0 8px 18px #6336711e}a.btn:focus-visible{outline:3px solid #885cad;outline-offset:3px}
a.btn.ig{background:#fff2f9}a.btn.tt{background:#f9f5ff}a.btn.wa{background:#f0fff6}
.symbol{width:42px;height:42px;display:grid;place-items:center;border-radius:13px;background:#fff;flex:none;font-weight:850;font-size:20px;box-shadow:0 2px 10px #0000000c}.ig .symbol{color:#be3580}.tt .symbol{color:#2a1b38}.wa .symbol{color:#1a9c61}
.txt{flex:1;font-weight:800;font-size:16px}.small{display:block;margin-top:4px;color:var(--mute);font-size:12px;font-weight:500}.arrow{font-size:26px;color:#876d92}
footer{margin-top:24px;color:#938198;font-size:12px}
</style>
</head>
<body>
<main>
<div class="mark" aria-hidden="true">VVS</div>
<p class="chip">Diseño · Creatividad · Impresión 3D</p>
<h1>Vernette Voxel Studio</h1>
<p class="subtitle">¡Damos vida a tus ideas en 3D! ✨<br>Encuéntranos en nuestras redes sociales.</p>
<nav aria-label="Redes sociales de Vernette Voxel Studio">
<a class="btn ig" href="https://www.instagram.com/vernettevoxelstudio/" target="_blank" rel="noopener noreferrer"><span class="symbol" aria-hidden="true">◎</span><span class="txt">Instagram<span class="small">@vernettevoxelstudio</span></span><span class="arrow" aria-hidden="true">›</span></a>
<a class="btn tt" href="https://www.tiktok.com/@vernettevoxelstudio" target="_blank" rel="noopener noreferrer"><span class="symbol" aria-hidden="true">♫</span><span class="txt">TikTok<span class="small">@vernettevoxelstudio</span></span><span class="arrow" aria-hidden="true">›</span></a>
<a class="btn wa" href="https://wa.me/message/RL4R22KYFB6ZC1" target="_blank" rel="noopener noreferrer"><span class="symbol" aria-hidden="true">✆</span><span class="txt">WhatsApp Business<span class="small">Consultas y pedidos</span></span><span class="arrow" aria-hidden="true">›</span></a>
</nav>
<footer>© Vernette Voxel Studio · Síguenos y comparte 💜</footer>
</main>
</body>
</html>
